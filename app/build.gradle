plugins {
    id "com.android.application"
}

android {
    namespace "com.artemiy.uprucheet"
    compileSdk 35

    defaultConfig {
        applicationId "com.artemiy.uprucheet"
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName "1.9.1"
        // Номер сборки GitHub Actions — показывается при установке обновления («сборка N»)
        manifestPlaceholders = [buildNumber: System.getenv("GITHUB_RUN_NUMBER") ?: "0"]
    }

    // Постоянный ключ подписи: без него каждая сборка в GitHub Actions подписывалась новым
    // случайным debug-ключом, и новую версию нельзя было установить поверх старой.
    signingConfigs {
        shared {
            storeFile file("upr-uchet.jks")
            storePassword "uprucheet"
            keyAlias "upr"
            keyPassword "uprucheet"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
